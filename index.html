<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Can You Spare $1?</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fa;
      color: #222;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .card {
      background: white;
      max-width: 520px;
      width: 100%;
      padding: 40px 30px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 10px 35px rgba(0,0,0,0.1);
    }

    h1 {
      font-size: 42px;
      margin: 0 0 15px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
    }

    .goal {
      margin: 30px 0;
    }

    .amount {
      font-size: 34px;
      font-weight: bold;
    }

    .bar {
      width: 100%;
      height: 18px;
      background: #e5e7eb;
      border-radius: 20px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress {
      width: 0%;
      height: 100%;
      background: #3d95ce;
      border-radius: 20px;
    }

    .donate {
      display: inline-block;
      margin-top: 25px;
      padding: 16px 35px;
      background: #3d95ce;
      color: white;
      text-decoration: none;
      font-size: 20px;
      font-weight: bold;
      border-radius: 12px;
      transition: 0.2s;
    }

    .donate:hover {
      transform: scale(1.04);
    }

    .small {
      font-size: 14px;
      color: #888;
      margin-top: 25px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h1>Can You Spare $1?</h1>

    <p>
      I'm trying to raise some money and I'm asking people who are willing
      to help for just $1.
    </p>

    <div class="goal">
      <div class="amount">$0 raised</div>
      <p>Goal: $1,000,000</p>

      <div class="bar">
        <div class="progress"></div>
      </div>
    </div>

    <a
      class="donate"
      href="https://venmo.com/u/j_doshen63"
      target="_blank"
      rel="noopener noreferrer">
      Donate $1 on Venmo
    </a>

    <p class="small">
      No pressure at all. If you don't want to donate, sharing this page
      helps too.
    </p>

  </div>

</body>
</html>
